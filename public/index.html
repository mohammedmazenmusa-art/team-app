<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>فريق النخبة لكرة القدم</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
  <h1>فريق النخبة لكرة القدم</h1>
  <p class="sub">القادم أجمل ⚽</p>
</div>

<!-- 🔔 تم إضافة شريط التنبيه تحت الشعار -->
<div id="notifyBar"></div>

<hr class="goal">

<div class="form">
  <input id="name" placeholder="اسم اللاعب">
  <input id="number" placeholder="رقم من 3 خانات">
  <button onclick="register()">تسجيل</button>
  <button onclick="cancel()">اعتذار</button>
</div>

<div id="msg"></div>

<div class="grid">

  <div class="box blue">
    <h2>أساسي (<span id="m1">24</span>)</h2>
    <ul id="main"></ul>
  </div>

  <div class="box green">
    <h2>احتياطي (<span id="m2">3</span>)</h2>
    <ul id="reserve"></ul>
  </div>

  <div class="box orange">
    <h2>انتظار (<span id="m3">3</span>)</h2>
    <ul id="waiting"></ul>
  </div>

</div>

<div class="admin">
  <button onclick="toggle()">فتح/إغلاق التسجيل</button>
  <button onclick="showAdminModal()">مسح القائمة</button>

  <!-- 🔐 زر جديد (إضافة فقط) -->
  <button onclick="showDetail()">عرض تفصيلي للقائمة</button>

  

</div>

<!-- مسح القائمة -->
<div id="adminModal" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
color:black;
padding:20px;
border-radius:10px;
z-index:999;
box-shadow:0 0 10px black;">

  <p>
    ادخل كلمة السر خاص فقط بالإدارة الرجاء عدم المحاولة
  </p>

  <input id="adminPassword">

  <br><br>

  <button onclick="confirmAdminReset()">تأكيد</button>
  <button onclick="closeAdminModal()">إلغاء</button>

</div>

<!-- 🔐 نافذة العرض التفصيلي (إضافة فقط) -->
<div id="detailModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
color:white;
padding:20px;
overflow:auto;
z-index:1000;
">

  <h2>🔐 عرض تفصيلي للقائمة</h2>

  <input type="password" id="detailPassword" placeholder="كلمة المرور">
  <button onclick="openDetail()">دخول</button>
  <button onclick="closeDetail()">إغلاق</button>

  <div id="detailContent" style="margin-top:20px;"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<!-- 📄 مكتبة PDF (إضافة فقط) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
